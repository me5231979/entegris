name: Publish course to GitHub Pages

# GitHub Pages serves the gh-pages branch. This workflow copies the built single-file
# course from docs/ onto that branch whenever it changes, so the live link stays current.

on:
  push:
    branches: [claude/admiring-carson-vs73vs, main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "Publish course to GitHub Pages"
