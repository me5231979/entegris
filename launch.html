<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Great Leader Profile</title>
  <style>
    html, body { height: 100%; margin: 0; background: #FFFFFF; overflow: hidden; }
    iframe { display: block; width: 100vw; height: 100vh; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <!-- SCORM 1.2 launch page. Owns the LMS session; the course runs in the frame below. -->
  <iframe id="course" src="index.html" title="The Great Leader Profile course"></iframe>
  <script src="js/scorm-api.js"></script>
  <script>
    (function () {
      // LMSs often open the SCO in a small popup. Ask for the full screen when we are a popup.
      try {
        if (window.opener && window.top === window && screen && screen.availWidth) {
          window.moveTo(0, 0); window.resizeTo(screen.availWidth, screen.availHeight);
        }
      } catch (e) { /* not permitted; the LMS controls the window */ }
      window.EntegrisScorm.init();
      var finished = false;
      function finish() { if (finished) { return; } finished = true; window.EntegrisScorm.finish(); }
      window.addEventListener('pagehide', finish);
      window.addEventListener('beforeunload', finish);
      window.addEventListener('unload', finish);
    })();
  </script>
</body>
</html>
